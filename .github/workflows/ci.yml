name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v5
      # Replica set 1 node, không xác thực, chỉ cho test tích hợp (DAL dùng transaction).
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.2.12 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:migrate

  docker:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Chỉ kiểm tra image build được. Đẩy GHCR, quét Trivy và deploy: Giai đoạn 3.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: quizz:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
