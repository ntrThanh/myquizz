name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      # Mongo đơn lẻ, không xác thực: chỉ dùng cho test tích hợp của migration runner.
      mongo:
        image: mongo:8.2.12
        ports: ["27017:27017"]
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:migrate

  docker:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Chỉ kiểm tra image build được. Đẩy GHCR, quét Trivy và deploy: Giai đoạn 3.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: quizz:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
